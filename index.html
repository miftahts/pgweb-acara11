<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGIS GeoServer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }

        .legend {
            background: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            max-height: 70vh;
            overflow: auto;
            box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
            font: 12px system-ui, sans-serif;
        }

        .legend b {
            display: block;
            margin: 6px 0 4px;
        }

        .legend b:first-child {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* ---- Sumber data ---- */
        // GeoServer lokal
        var WORKSPACE = 'pgweb';
        var LAYER_DESA = WORKSPACE + ':Sleman_Admin_Kec';
        var LAYER_JALAN = WORKSPACE + ':Jalan_SL';
        var GS_LOKAL = 'http://localhost:8080/geoserver/' + WORKSPACE + '/wms';

        // GeoServer Geoportal Kabupaten Sleman (layanan eksternal)
        var LAYER_BANK = 'geonode:a__3404_ar_50kb_banksampah_sleman_2017';
        var GS_BANK = 'https://geoportal.slemankab.go.id/geoserver/ows';

        var map = L.map('map').setView([-7.72, 110.35], 11);

        /* Basemap */
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

        /* Layer WMS (zIndex mengatur urutan tumpukan) */
        function wms(url, layer, z) {
            return L.tileLayer.wms(url, {
                layers: layer, format: 'image/png', transparent: true,
                version: '1.1.1', zIndex: z
            });
        }
        var desa = wms(GS_LOKAL, LAYER_DESA, 1).addTo(map);
        var jalan = wms(GS_LOKAL, LAYER_JALAN, 2).addTo(map);
        var bank = wms(GS_BANK, LAYER_BANK, 3).addTo(map);

        /* Kontrol layer */
        L.control.layers({ 'OpenStreetMap': osm }, {
            'Batas Administrasi Kecamatan': desa,
            'Jalan': jalan,
            'Bank Sampah Sleman 2017': bank
        }, { collapsed: false }).addTo(map);

        /* Legenda (otomatis dari style GeoServer lewat GetLegendGraphic) */
        function urlLegenda(url, layer) {
            return url + '?service=WMS&request=GetLegendGraphic&version=1.1.1&format=image/png'
                + '&width=18&height=18&layer=' + encodeURIComponent(layer);
        }
        var legenda = L.control({ position: 'bottomleft' });
        legenda.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            [['Kecamatan', GS_LOKAL, LAYER_DESA], ['Bank Sampah', GS_BANK, LAYER_BANK]].forEach(function (x) {
                var judul = document.createElement('b'); judul.textContent = x[0];
                var img = document.createElement('img'); img.src = urlLegenda(x[1], x[2]);
                div.append(judul, img);
            });
            return div;
        };
        legenda.addTo(map);

        /* Klik peta -> GetFeatureInfo dari layer yang sedang aktif */
        function ambilInfo(url, layer, e) {
            var size = map.getSize(), pt = map.latLngToContainerPoint(e.latlng);
            var q = new URLSearchParams({
                service: 'WMS', version: '1.1.1', request: 'GetFeatureInfo',
                layers: layer, query_layers: layer, srs: 'EPSG:4326',
                bbox: map.getBounds().toBBoxString(), width: size.x, height: size.y,
                x: Math.round(pt.x), y: Math.round(pt.y),
                info_format: 'application/json', feature_count: 1
            });
            return fetch(url + '?' + q)
                .then(function (r) { return r.json(); })
                .then(function (d) { return d.features && d.features.length ? d.features[0].properties : null; });
        }

        map.on('click', function (e) {
            // urutan prioritas: bank sampah, jalan, kecamatan
            var sumber = [[bank, GS_BANK, LAYER_BANK], [jalan, GS_LOKAL, LAYER_JALAN], [desa, GS_LOKAL, LAYER_DESA]]
                .filter(function (s) { return map.hasLayer(s[0]); });

            (function coba(i) {
                if (i >= sumber.length) return;
                ambilInfo(sumber[i][1], sumber[i][2], e)
                    .then(function (p) {
                        if (!p) return coba(i + 1);
                        var el = document.createElement('div');
                        Object.keys(p).forEach(function (k) {
                            var baris = document.createElement('div');
                            baris.textContent = k + ': ' + p[k];
                            el.appendChild(baris);
                        });
                        L.popup().setLatLng(e.latlng).setContent(el).openOn(map);
                    })
                    .catch(function () { coba(i + 1); });
            })(0);
        });
    </script>
</body>

</html>
